[package]
name = "mpc-cggmp24-spike"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
cggmp24 = { version = "0.7.0-alpha.3", default-features = false, features = ["std", "backend-num-bigint", "curve-secp256k1", "state-machine", "spof"] }
cggmp24-keygen = { version = "=0.7.0-alpha.3", default-features = false, features = ["std", "state-machine"] }
getrandom = { version = "0.2", features = ["js"] }
hex = "0.4"
paillier-zk = "=0.7.0-alpha.3"
rand = "0.8"
round-based = { version = "0.4.1", features = ["sim"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"
sha2 = "0.10"
wasm-bindgen = "0.2"

[patch.crates-io]
core2 = { path = "vendor/core2-stub" }
